<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인터넷 연결을 확인해 주세요 · 두고클래스</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #fff; color: #111; text-align: center; }
  .box { max-width: 320px; }
  .ic { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; background: #fff1f3; display: grid; place-items: center; color: #e0103a; font-size: 28px; font-weight: 900; }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { font-size: 14px; line-height: 1.6; color: #555; margin: 0 0 22px; }
  button { width: 100%; height: 50px; border: 0; border-radius: 12px; background: #e0103a; color: #fff; font: 700 16px/1 inherit; cursor: pointer; }
</style>
</head>
<body>
  <main class="box">
    <div class="ic" aria-hidden="true">!</div>
    <h1>인터넷 연결을 확인해 주세요</h1>
    <p>와이파이나 데이터가 켜져 있는지 확인한 뒤<br>다시 시도해 주세요.</p>
    <button type="button" onclick="location.href='https://www.doogoclass.com/#/vod'">다시 시도</button>
  </main>
</body>
</html>
